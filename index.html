<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        var t = localStorage.getItem('snug-theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#232425')
      } catch (e) {}
    </script>
    <title>Snug &amp; Co. | Loungewear, Tracksuits &amp; Matchday Wear in Nairobi, Kenya</title>
    <meta name="description" content="Shop Snug &amp; Co., a Nairobi clothing brand: lounge sets, tracksuits, hoodies, jackets and matchday wear. Comfortable, minimal fashion in Kenya. Order on WhatsApp." />
    <meta property="og:site_name" content="Snug & Co." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Snug &amp; Co. | Loungewear, Tracksuits &amp; Matchday Wear in Nairobi, Kenya" />
    <meta property="og:description" content="Where comfort meets elevated living. Lounge sets, tracksuits and matchday pieces from Nairobi." />
    <meta property="og:image" content="/og-default.jpg" />
    <meta property="og:locale" content="en_KE" />
    <meta name="keywords" content="Snug and Co, Snug & Co Kenya, clothing brand Nairobi, loungewear Kenya, lounge sets Nairobi, tracksuits Kenya, hoodies Nairobi, jackets Kenya, matchday jerseys Kenya, Kenya bomber jacket, comfortable clothing Kenya, Kenyan fashion brand, buy clothes online Kenya, streetwear Nairobi" />
    <meta name="geo.region" content="KE-30" />
    <meta name="geo.placename" content="Nairobi" />
    <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Fetch shop data early (not needed on admin).
      if (!location.pathname.startsWith('/admin')) {
        ;['/api/catalog', '/api/settings'].forEach(function (href) {
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'fetch'
          link.crossOrigin = 'anonymous'
          link.href = href
          document.head.appendChild(link)
        })
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Snug &amp; Co. needs JavaScript to show the collection. You can also find us on Instagram at
        <a href="https://www.instagram.com/snug_co_ke/">@snug_co_ke</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
